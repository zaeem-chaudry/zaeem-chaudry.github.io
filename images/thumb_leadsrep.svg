<svg xmlns="http://www.w3.org/2000/svg" width="160" height="120" viewBox="0 0 160 120">
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0d1b2a"/>
    <stop offset="100%" stop-color="#1b2838"/>
  </linearGradient>
</defs>
<rect width="160" height="120" fill="url(#g)"/>
<!-- chat bubbles -->
<rect x="12" y="20" width="80" height="22" rx="8" fill="#1772d0" opacity=".85"/>
<text font-family="sans-serif" font-size="8" fill="#fff" x="52" y="35" text-anchor="middle">User message</text>
<polygon points="20,42 28,42 24,50" fill="#1772d0" opacity=".85"/>

<rect x="68" y="52" width="80" height="22" rx="8" fill="#2d4a22"/>
<text font-family="sans-serif" font-size="8" fill="#7ee787" x="108" y="67" text-anchor="middle">RAG response</text>
<polygon points="140,74 148,74 144,82" fill="#2d4a22"/>

<rect x="12" y="84" width="72" height="22" rx="8" fill="#1772d0" opacity=".7"/>
<text font-family="sans-serif" font-size="8" fill="#fff" x="48" y="99" text-anchor="middle">Follow-up...</text>
<polygon points="20,106 28,106 24,114" fill="#1772d0" opacity=".7"/>

<!-- vector store label -->
<text font-family="'Courier New',monospace" font-size="8" fill="#58a6ff" x="80" y="12" text-anchor="middle">Multi-tenant RAG · ChromaDB</text>
</svg>
